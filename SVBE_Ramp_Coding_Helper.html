<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BikeX Purchase Coding Helper</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brown:     #4A3728;
    --green:     #4A7C3F;
    --lt-green:  #EBF3E8;
    --dk-green:  #2E5C26;
    --cream:     #FAF7F3;
    --warm-grey: #E8E2DA;
    --text:      #2C2416;
    --muted:     #7A6E65;
    --white:     #FFFFFF;
    --result-bg: #F0F7EE;
    --shadow:    0 4px 24px rgba(74,55,40,0.10);
    --radius:    14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  .header { width: 100%; max-width: 580px; margin-bottom: 28px; text-align: center; }
  .header-badge {
    display: inline-block; background: var(--brown); color: var(--white);
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 10px;
  }
  .header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(22px,5vw,30px); color: var(--brown); line-height: 1.2; margin-bottom: 6px; }
  .header p  { font-size: 14px; color: var(--muted); line-height: 1.5; }

  .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 580px; overflow: hidden; }

  .progress-bar  { height: 4px; background: var(--warm-grey); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--dk-green)); transition: width 0.4s ease; border-radius: 0 2px 2px 0; }

  .screen { padding: 28px 28px 24px; display: none; animation: fadeIn 0.25s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

  .step-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
  .question   { font-family: 'DM Serif Display', serif; font-size: clamp(17px,4vw,21px); color: var(--brown); line-height: 1.35; margin-bottom: 14px; }

  .hint { font-size: 13px; color: var(--muted); margin-bottom: 18px; padding: 10px 14px; background: var(--lt-green); border-left: 3px solid var(--green); border-radius: 0 8px 8px 0; line-height: 1.5; }
  .hint strong { color: var(--dk-green); }

  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-btn {
    display: flex; align-items: center; gap: 13px;
    background: var(--cream); border: 2px solid var(--warm-grey); border-radius: 10px;
    padding: 12px 15px; cursor: pointer; text-align: left;
    transition: all 0.16s ease; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; color: var(--text); width: 100%;
  }
  .opt-btn:hover { border-color: var(--green); background: var(--lt-green); transform: translateX(3px); }
  .opt-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--warm-grey); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; transition: background 0.16s; }
  .opt-btn:hover .opt-icon { background: #d4e8d0; }
  .opt-text  { flex: 1; }
  .opt-label { display: block; font-weight: 600; }
  .opt-sub   { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── RESULT ── */
  .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .result-icon   { width: 44px; height: 44px; background: var(--lt-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .result-title  { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--brown); line-height: 1.2; }
  .result-sub    { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .coding-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .coding-row  { background: var(--result-bg); border: 1.5px solid #c8e0c4; border-radius: 10px; padding: 13px 15px; }
  .coding-row.split-row { background: #FEF9ED; border-color: #E8C97A; }
  .coding-row.ask-row   { background: #FEF3F3; border-color: #E8AAAA; }
  .row-label   { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .split-row .row-label { color: #8A6820; }
  .ask-row   .row-label { color: #8A2020; }

  .code-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; flex-direction: column; background: var(--white); border: 1.5px solid #b8d4b4; border-radius: 8px; padding: 6px 12px; min-width: 88px; }
  .split-row .chip { border-color: #d4b86a; }
  .ask-row   .chip { border-color: #d4aaaa; }
  .chip-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .chip-value { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--brown); line-height: 1.2; }
  .chip-desc  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .result-note { font-size: 12px; color: var(--muted); background: #FEF9ED; border-left: 3px solid #E8C97A; border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 14px; line-height: 1.5; }
  .result-warn { font-size: 12px; color: #6B2020; background: #FEF3F3; border-left: 3px solid #E8AAAA; border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 14px; line-height: 1.5; }

  .checklist       { background: var(--lt-green); border-radius: 10px; padding: 13px 15px; margin-bottom: 18px; }
  .checklist-title { font-size: 11px; font-weight: 600; color: var(--dk-green); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 9px; }
  .check-item      { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: var(--text); margin-bottom: 5px; line-height: 1.4; }
  .check-item:last-child { margin-bottom: 0; }
  .check-item::before { content: "✓"; color: var(--green); font-weight: 700; flex-shrink: 0; }

  .btn-row    { display: flex; gap: 10px; margin-top: 4px; }
  .btn-back   { display: flex; align-items: center; gap: 5px; background: none; border: 1.5px solid var(--warm-grey); border-radius: 8px; padding: 10px 15px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.16s; white-space: nowrap; }
  .btn-back:hover { border-color: var(--brown); color: var(--brown); }
  .btn-restart { flex: 1; background: var(--brown); border: none; border-radius: 8px; padding: 12px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; color: var(--white); cursor: pointer; transition: background 0.16s; }
  .btn-restart:hover { background: #3a2a1e; }

  .footer { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
  .footer a { color: var(--green); text-decoration: none; }
  @media (max-width: 420px) { .screen { padding: 18px; } .opt-btn { padding: 11px 13px; } }
</style>
</head>

// ═══════════════════════════════════════════════════════════════════
//  ENGINE
// ═══════════════════════════════════════════════════════════════════
let history = [];
let current = 'root';

function progressPct(nodeId) {
  const node = TREE[nodeId];
  if (!node || node.type === 'result') return 100;
  const label = node.stepLabel || '';
  const m = label.match(/(\d+) of (\d+)/);
  if (!m) return nodeId === 'other_menu' ? 50 : 10;
  return Math.round((parseInt(m[1]) - 1) / parseInt(m[2]) * 100);
}

function render() {
  const container = document.getElementById('screenContainer');
  const fill = document.getElementById('progressFill');
  fill.style.width = progressPct(current) + '%';

  const node = TREE[current];
  if (!node) return;

  const div = document.createElement('div');
  div.className = 'screen active';

  if (node.type === 'question') {
    div.innerHTML = `
      ${node.stepLabel ? `<div class="step-label">${node.stepLabel}</div>` : (current === 'other_menu' ? '<div class="step-label">Other Purchases</div>' : '')}
      <div class="question">${node.label}</div>
      ${node.hint ? `<div class="hint">${node.hint}</div>` : ''}
      <div class="options">
        ${node.options.map(o => `
          <button class="opt-btn" onclick="choose('${o.next}')">
            <div class="opt-icon">${o.icon}</div>
            <div class="opt-text">
              <span class="opt-label">${o.label}</span>
              ${o.sub ? `<span class="opt-sub">${o.sub}</span>` : ''}
            </div>
          </button>`).join('')}
      </div>
      ${history.length > 0 ? `<div class="btn-row" style="margin-top:16px"><button class="btn-back" onclick="goBack()">← Back</button></div>` : ''}
    `;

  } else {
    // result
    fill.style.width = '100%';
    const r = node;

    let rowsHTML = '';
    r.rows.forEach(row => {
      const cls = row.split ? 'coding-row split-row' : 'coding-row';
      rowsHTML += `<div class="${cls}">
        <div class="row-label">${row.label}</div>
        <div class="code-chips">${row.chips.map(c => `
          <div class="chip">
            <span class="chip-label">${c.label}</span>
            <span class="chip-value">${c.value}</span>
            <span class="chip-desc">${c.desc}</span>
          </div>`).join('')}
        </div></div>`;
    });

    const noteHTML  = r.note    ? `<div class="result-note">⚠️ ${r.note}</div>` : '';
    const askHTML   = r.askMsg  ? `<div class="result-warn">📋 ${r.askMsg}</div>` : '';
    const checkHTML = !r.ask    ? `<div class="checklist">
      <div class="checklist-title">Before you close the transaction</div>
      <div class="check-item">Receipt is attached</div>
      <div class="check-item">QuickBooks Category is correct</div>
      <div class="check-item">QuickBooks Class is correct</div>
      <div class="check-item">&ldquo;Receipt matches transaction&rdquo; notification is visible</div>
    </div>` : '';

    div.innerHTML = `
      <div class="result-header">
        <div class="result-icon">${r.ask ? '📋' : '✅'}</div>
        <div>
          <div class="result-title">${r.title}</div>
          <div class="result-sub">${r.sub}</div>
        </div>
      </div>
      ${rowsHTML ? `<div class="coding-rows">${rowsHTML}</div>` : ''}
      ${noteHTML}
      ${askHTML}
      ${checkHTML}
      <div class="btn-row">
        <button class="btn-back" onclick="goBack()">← Back</button>
        <button class="btn-restart" onclick="restart()">↩ Code another purchase</button>
      </div>
    `;
  }

  container.innerHTML = '';
  container.appendChild(div);
  document.getElementById('mainCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function choose(next) {
  history.push(current);
  current = next;
  render();
}
function goBack() {
  if (history.length > 0) { current = history.pop(); render(); }
}
function restart() {
  history = [];
  current = 'root';
  render();
}

render();
</script>
